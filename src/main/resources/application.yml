spring:
  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_BYTES:10485760}B
      max-request-size: ${ATTACHMENT_REQUEST_MAX_BYTES:11534336}B
  # Spring Boot explicitly imports the root .env; Gradle does not load it itself.
  config:
    import: optional:file:.env[.properties]

  application:
    name: devspace

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OIDC_GOOGLE_CLIENT_ID}
            client-secret: ${OIDC_GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: ${OIDC_GOOGLE_REDIRECT_URI}
            client-settings:
              require-proof-key: true
        provider:
          google:
            issuer-uri: ${OIDC_GOOGLE_ISSUER_URI:https://accounts.google.com}

server:
  servlet:
    session:
      timeout: ${SESSION_IDLE_TIMEOUT:12h}
      cookie:
        name: ${SESSION_COOKIE_NAME:JSESSIONID}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  storage:
    root: ${FILE_STORAGE_ROOT}
  attachment:
    max-bytes: ${ATTACHMENT_MAX_BYTES:10485760}
    cleanup:
      enabled: ${ATTACHMENT_CLEANUP_ENABLED:true}
      grace-seconds: ${ATTACHMENT_TEMP_GRACE_SECONDS:86400}
      delay-ms: ${ATTACHMENT_CLEANUP_DELAY_MS:600000}
      batch-size: ${ATTACHMENT_CLEANUP_BATCH_SIZE:100}
    stream:
      max-concurrent: ${ATTACHMENT_STREAM_MAX_CONCURRENT:16}
      timeout-ms: ${ATTACHMENT_STREAM_TIMEOUT_MS:30000}
  document:
    max-content-bytes: ${DOCUMENT_CONTENT_MAX_BYTES:1048576}
  link:
    max-links: ${DEVSPACE_LINK_MAX_LINKS:500}
  project:
    cursor-signing-key: ${PROJECT_CURSOR_SIGNING_KEY}
  security:
    origin: ${APP_ORIGIN:http://localhost:8080}
