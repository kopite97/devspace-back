
name: Deploy Devspace Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      initialize_postgres:
        description: "Start PostgreSQL (first setup only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: devspace-back-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Application
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45

    env:
      ENV_FILE: /opt/devspace-back/.env

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Environment
        shell: bash
        run: |
          set -euo pipefail

          test -r "$ENV_FILE"

          docker compose \
            --env-file "$ENV_FILE" \
            -f compose.yml \
            config -q

      # 수동 실행 시 옵션을 선택한 경우에만 기동
      - name: Initialize PostgreSQL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_postgres }}
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --env-file "$ENV_FILE" \
            -f compose.yml \
            up -d --wait --wait-timeout 180 postgres

      - name: Check PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          CID=$(docker compose \
            --env-file "$ENV_FILE" \
            -f compose.yml \
            ps -q postgres)

          if [ -z "$CID" ]; then
            echo "::error::PostgreSQL container not found"
            exit 1
          fi

          STATUS=$(docker inspect \
            --format '{{.State.Health.Status}}' "$CID")

          if [ "$STATUS" != "healthy" ]; then
            echo "::error::PostgreSQL is not healthy"
            exit 1
          fi

          echo "PostgreSQL is healthy"

      - name: Deploy Application
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --env-file "$ENV_FILE" \
            -f compose.yml \
            up -d \
            --no-deps \
            --build \
            --wait \
            --wait-timeout 120 \
            app

      - name: Check Deployment
        shell: bash
        run: |
          docker compose \
            --env-file "$ENV_FILE" \
            -f compose.yml \
            ps
