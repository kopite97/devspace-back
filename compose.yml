
services:
  postgres:
    image: postgres:16.4
    container_name: devspace-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    volumes:
      - devspace-postgres-data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    container_name: devspace-back
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - /opt/devspace-back/.env

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      FILE_STORAGE_ROOT: /var/lib/devspace/document-storage
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem

    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"

    volumes:
      - type: bind
        source: ${GITHUB_PRIVATE_KEY_PATH:?GITHUB_PRIVATE_KEY_PATH must point to the host PEM file}
        target: /run/secrets/github-app.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/devspace/document-storage
        target: /var/lib/devspace/document-storage
        bind:
          create_host_path: false

    networks:
      - backend

    depends_on:
      postgres:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

volumes:
  devspace-postgres-data:

networks:
  backend:
    external: true
    name: devspace
